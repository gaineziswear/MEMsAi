services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      VOICEHUB_DATABASE_URL: postgresql+psycopg2://voicehub:voicehub@postgres:5432/voicehub
      VOICEHUB_REDIS_URL: redis://redis:6379/0
      VOICEHUB_STORAGE_BACKEND: minio
    volumes: ["voicehub-data:/app/data"]
    depends_on: [postgres, redis, minio]
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    environment:
      VOICEHUB_DATABASE_URL: postgresql+psycopg2://voicehub:voicehub@postgres:5432/voicehub
      VOICEHUB_REDIS_URL: redis://redis:6379/0
    volumes: ["voicehub-data:/app/data"]
    depends_on: [api, redis]
  frontend:
    build: ./frontend
    command: npm run dev -- --hostname 0.0.0.0
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: voicehub, POSTGRES_PASSWORD: voicehub, POSTGRES_DB: voicehub }
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    environment: { MINIO_ROOT_USER: voicehub, MINIO_ROOT_PASSWORD: voicehub-secret }
    volumes: ["minio-data:/data"]
volumes:
  voicehub-data:
  postgres-data:
  minio-data:
