apiVersion: apps/v1
kind: Deployment
metadata: { name: voicehub-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: voicehub-api } }
  template:
    metadata: { labels: { app: voicehub-api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/example/voicehub-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: voicehub-secrets } }]
---
apiVersion: v1
kind: Service
metadata: { name: voicehub-api }
spec:
  selector: { app: voicehub-api }
  ports: [{ port: 8000, targetPort: 8000 }]
